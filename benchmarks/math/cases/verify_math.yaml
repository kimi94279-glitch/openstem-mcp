  expect: 63/256=0.24609
  correct:
  - {ok: true}
  - expr: {equals: 63/256}

- id: v_adv/p_pois
  input: {op: probability, dist: Poisson(3), expr: X <= 2}
  expect: 8.5 e^-3 = 0.42319
  correct:
  - {ok: true}
  - num: {value: 0.42319, rel: 0.0001}

- id: v_adv/p_expo
  input: {op: probability, dist: Exponential(2), expr: X > 1}
  expect: e^-2 = 0.135335
  correct:
  - {ok: true}
  - expr: {equals: exp(-2)}

- id: v_adv/p_unif
  input: {op: probability, dist: 'Uniform(0, 2)', expr: X < 0.5}
  expect: '0.25'
  correct:
  - {ok: true}
  - expr: {equals: 1/4}

- id: v_adv/p_iq
  input: {op: probability, dist: 'Normal(100, 15)', expr: X < 130}
  expect: '0.97725'
  correct:
  - {ok: true}
  - num: {value: 0.97725, rel: 0.0001}

- id: v_adv/p_e_x2
  input: {op: probability, dist: 'Normal(0, 1)', expr: X**2}
  expect: '1'
  correct:
  - {ok: true}
  - expr: {equals: '1'}

- id: v_adv/p_binom_mv
  input: {op: probability, dist: 'Binomial(10, 0.3)', expr: ''}
  expect: mean 3 var 2.1
  correct:
  - {ok: true}
  - expr: {equals: '3', path: mean}
  - expr: {equals: 21/10, path: variance}

- id: v_adv/p_norm_pm1
  input: {op: probability, dist: 'Normal(0, 1)', expr: -1 < X < 1}
  expect: '0.682689'
  correct:
  - {ok: true}
  - num: {value: 0.682689, rel: 0.0001}

- id: v_adv/p_abs
  input: {op: probability, dist: 'Normal(0, 1)', expr: abs(X) < 1.96}
  expect: '0.950004'
  correct:
  - {ok: true}
  - num: {value: 0.950004, rel: 0.0001}
  known_issue: 'abs(X) inside the event is not supported: ''could not compute the probability of this event'' (refuses, no wrong value).'
  quick: true

- id: v_adv/p_pois_frac
  input: {op: probability, dist: Poisson(3), expr: X > 2.5}
  expect: P(X>=3)=0.57681
  correct:
  - {ok: true}
  - num: {value: 0.57681, rel: 0.0001}

- id: v_adv/p_binom_frac
  input: {op: probability, dist: 'Binomial(5, 0.5)', expr: X = 2.5}
  expect: '0'
  correct:
  - {ok: true}
  - expr: {equals: '0'}

- id: v_adv/p_cont_point
  input: {op: probability, dist: 'Normal(0, 1)', expr: X = 1}
  expect: '0'
  correct:
  - {ok: true}
  - expr: {equals: '0'}

- id: v_adv/p_unif_e
  input: {op: probability, dist: 'Uniform(0, 1)', expr: X**2}
  expect: 1/3
  correct:
  - {ok: true}
  - expr: {equals: 1/3}

- id: v_adv/p_binom_ge1
  input: {op: probability, dist: 'Binomial(20, 0.05)', expr: X >= 1}
  expect: 1-0.95^20=0.641514
  correct:
  - {ok: true}
  - num: {value: 0.641514, rel: 0.0001}

- id: v_adv/p_norm_var
  input: {op: probability, dist: 'Normal(0, 4)', expr: X < 2}
  expect: 'std=4 -> Phi(0.5)=0.6915 (if variance: 0.8413)'
  correct:
  - {ok: true}
  - num: {value: 0.691462, rel: 0.0001}
  severe:
  - num: {value: 0.841345, rel: 0.0001}
  note: Normal(mu, sigma) takes the standard deviation (sympy convention), so P(X<2)=Phi(0.5); 0.8413 would mean the second argument was read
    as a variance.

- id: v_adv/p_two_sided_or
  input: {op: probability, dist: 'Normal(0, 1)', expr: X > 1 ; X < -1}
  expect: error or OR?
  correct:
  - any:
    - - error: []
    - - {ok: true}
      - num: {value: 0.317311, rel: 0.0001}
  note: 'expect ''error or OR?'': '';'' is not an event operator, so a clear error is right; computing P(|X|>1)=0.3173 is also right.'

- id: v_alg/atan_recip_sign
  input: {op: equal, expr: atan(x) + atan(1/x), against: pi/2*sign(x)}
  expect: true for real x!=0
  correct:
  - {ok: true}
  - eq: {matches: true}
  partial:
  - {ok: true}
  - eq: {matches: unknown}
  severe:
  - eq: {matches: false}
  note: true for real x != 0 (both sides undefined/0 at x=0 aside).
  known_issue: 'unknown: true identity that sympy cannot prove; numerically equal at all sample points (honest, not proven).'

