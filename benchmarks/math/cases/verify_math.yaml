# verify_math: 풀이 검산(equal, solve, ode, laplace, matrix, probability, series, sum, integrate, limit, diff, evaluate)
# 원본: benchmarks/raw/audit-2026-11-03.json(2026-11-03 감사). input·expect는 원본 그대로, correct/partial/severe는 기계 판정 조건.
# 문법은 benchmarks/math/README.md. note는 사람의 기대를 고치거나 해석한 이유, known_issue는 아직 틀리는 원인 한 줄.

tool: verify_math
cases:

- id: v_adv/s_log2
  input: {op: solve, expr: log(x - 2) + log(x + 1) = 2*log(2)}
  expect: 3 only (x=-2 extraneous)
  correct:
  - {ok: true}
  - solutions: ['3']
  partial:
  - {ok: true}
  - solutions_include: ['3']
  severe:
  - solutions_include: ['-2']
  quick: true

- id: v_adv/s_log10
  input: {op: solve, expr: log10(x) + log10(x + 3) = 1}
  expect: 2 only (x=-5 extraneous)
  correct:
  - {ok: true}
  - solutions: ['2']
  severe:
  - solutions_include: ['-5']

- id: v_adv/s_ln_pair
  input: {op: solve, expr: log(x - 1) + log(x + 1) = log(3)}
  expect: 2 only
  correct:
  - {ok: true}
  - solutions: ['2']
  severe:
  - solutions_include: ['-2']

- id: v_adv/s_log_pos
  input: {op: solve, expr: log(x) + log(x - 3) = log(10), assume: positive}
  expect: '5'
  correct:
  - {ok: true}
  - solutions: ['5']

- id: v_adv/s_log_diff
  input: {op: solve, expr: log(x) - log(x - 1) = log(2)}
  expect: '2'
  correct:
  - {ok: true}
  - solutions: ['2']

- id: v_adv/s_sqrt2
  input: {op: solve, expr: sqrt(2*x + 3) = x}
  expect: 3 only
  correct:
  - {ok: true}
  - solutions: ['3']
  severe:
  - solutions_include: ['-1']

- id: v_adv/s_exp4
  input: {op: solve, expr: 4**x - 3*2**x + 2 = 0}
  expect: 0, 1
  correct:
  - {ok: true}
  - solutions: ['0', '1']

- id: v_adv/s_logb
  input: {op: solve, expr: 'log(x, 2) = 3'}
  expect: '8'
  correct:
  - {ok: true}
  - solutions: ['8']

- id: v_adv/eq_latex_cbrt
  input: {op: equal, expr: '\sqrt[3]{-8}', against: '-2', latex: true}
  expect: 'true'
  correct:
  - {ok: true}
  - eq: {matches: true}
  severe:
  - eq: {matches: false}
  quick: true

- id: v_adv/eq_cbrt_pow
  input: {op: equal, expr: (-8)**(1/3), against: '-2'}
  expect: true in real-number convention
  correct:
  - {ok: true}
  - any:
    - - eq: {matches: true}
    - - eq: {matches: false}
      - has: [cbrt]
  partial:
  - {ok: true}
  - in:
      matches: [false, unknown]
  note: expect 'true in real-number convention'. principal-root convention (x**(1/3) of a negative base is complex) is a documented design choice;
    a principal-consistent answer that points to cbrt() counts as correct, a silent one as partial.

- id: v_adv/ode_exp
  input: {op: ode, expr: y' = y}
  expect: C1 e^x
  correct:
  - {ok: true}
  - expr:
      equals: C1*exp(x)
      consts: [C1]

- id: v_adv/ode_sin_ics
  input: {op: ode, expr: y'' + y = 0, ics: 'y(0)=0, y''(0)=1'}
  expect: sin(x)
  correct:
  - {ok: true}
  - expr: {equals: sin(x)}

- id: v_adv/ode_forced
  input: {op: ode, expr: y'' + 3*y' + 2*y = sin(x)}
  expect: C1e^-2x + C2e^-x + (sin x - 3cos x)/10
  correct:
  - {ok: true}
  - expr:
      equals: C1*exp(-2*x) + C2*exp(-x) + (sin(x) - 3*cos(x))/10
      consts: [C1, C2]

- id: v_adv/ode_first_lin
  input: {op: ode, expr: y' + 2*y = 4, ics: y(0)=0}
  expect: 2 - 2e^-2x
  correct:
  - {ok: true}
  - expr: {equals: 2 - 2*exp(-2*x)}

- id: v_adv/ode_against_wrong_ic
  input: {op: ode, expr: y'' + y = 0, ics: 'y(0)=0, y''(0)=1', against: cos(x)}
  expect: satisfies_ode true, ics false
  correct:
  - {ok: true}
  - eq: {matches: false}
  - eq: {against.satisfies_ode: true, against.satisfies_ics: false}
  partial:
  - {ok: true}
  - eq: {matches: false}
  severe:
  - eq: {matches: true}
  quick: true

- id: v_adv/ode_against_general
  input: {op: ode, expr: y'' - y = 0, against: C1*exp(x) + C2*exp(-x)}
  expect: matches true
  correct:
  - {ok: true}
  - eq: {matches: true}
  severe:
  - eq: {matches: false}

- id: v_adv/ode_against_wrong
  input: {op: ode, expr: y'' - y = 0, against: C1*exp(x) + C2*exp(2*x)}
  expect: matches false
  correct:
  - {ok: true}
  - eq: {matches: false}
  severe:
  - eq: {matches: true}

- id: v_adv/ode_sep_ics
  input: {op: ode, expr: y' = y**2, ics: y(0)=1}
  expect: 1/(1-x)
  correct:
  - {ok: true}
  - expr: {equals: 1/(1 - x)}

- id: v_adv/ode_implicit
  input: {op: ode, expr: y' = x/y}
  expect: y=±sqrt(C1+x^2)
  correct:
  - {ok: true}
  - solutions: [sqrt(C1 + x**2), -sqrt(C1 + x**2)]

- id: v_adv/ode_resonance
  input: {op: ode, expr: y'' + 4*y = cos(2*x)}
  expect: C1 sin2x + C2 cos2x + x sin(2x)/4
  correct:
  - {ok: true}
  - expr:
      equals: C1*sin(2*x) + C2*cos(2*x) + x*sin(2*x)/4
      consts: [C1, C2]

- id: v_adv/ode_euler
  input: {op: ode, expr: x**2*y'' - 2*x*y' + 2*y = 0}
  expect: C1 x + C2 x^2
  correct:
  - {ok: true}
  - expr:
      equals: C1*x + C2*x**2
      consts: [C1, C2]

- id: v_adv/ode_t
  input: {op: ode, expr: x'' + x = 0}
  expect: 'in t: C1 sin t + C2 cos t'
  correct:
  - {ok: true}
  - expr:
      equals: C1*sin(t) + C2*cos(t)
      consts: [C1, C2]

- id: v_adv/ode_logistic
  input: {op: ode, expr: y' = y*(1 - y)}
  expect: 1/(1 + C e^-x)
  correct:
  - {ok: true}
  - expr:
      equals: 1/(1 + C1*exp(-x))
      consts: [C1]

- id: v_adv/ode_rc
  input: {op: ode, expr: R*C*v' + v = V0, var: t, assume: positive}
  expect: V0 + C1 e^{-t/RC}
  correct:
  - {ok: true}
  - expr:
      equals: V0 + C1*exp(-t/(R*C))
      consts: [C1]

- id: v_adv/ode_against_particular
  input: {op: ode, expr: y'' + y = x, against: x}
  expect: x is particular solution
  correct:
  - {ok: true}
  - eq: {matches: true}
  - has: [particular]
  partial:
  - {ok: true}
  - eq: {matches: true}
  severe:
  - eq: {matches: false}

- id: v_adv/lap_t
  input: {op: laplace, expr: t}
  expect: 1/s^2
  correct:
  - {ok: true}
  - expr: {equals: 1/s**2}

- id: v_adv/lap_exp
  input: {op: laplace, expr: exp(-a*t)}
  expect: 1/(s+a)
  correct:
  - {ok: true}
  - expr: {equals: 1/(s + a)}

- id: v_adv/lap_sin
  input: {op: laplace, expr: sin(w*t)}
  expect: w/(s^2+w^2)
  correct:
  - {ok: true}
  - expr: {equals: w/(s**2 + w**2)}

- id: v_adv/lap_step
  input: {op: laplace, expr: Heaviside(t - 1)}
  expect: e^-s/s
  correct:
  - {ok: true}
  - expr: {equals: exp(-s)/s}

- id: v_adv/lap_texp
  input: {op: laplace, expr: t*exp(t)}
  expect: 1/(s-1)^2
  correct:
  - {ok: true}
  - expr: {equals: 1/(s - 1)**2}

- id: v_adv/lap_tsin
  input: {op: laplace, expr: t*sin(t)}
  expect: 2s/(s^2+1)^2
  correct:
  - {ok: true}
  - expr: {equals: 2*s/(s**2 + 1)**2}

- id: v_adv/lap_one
  input: {op: laplace, expr: '1'}
  expect: 1/s
  correct:
  - {ok: true}
  - expr: {equals: 1/s}

- id: v_adv/lap_exp_t2
  input: {op: laplace, expr: exp(t**2)}
  expect: no transform
  correct:
  - error: []
  severe:
  - {ok: true}

- id: v_adv/lap_1_t
  input: {op: laplace, expr: 1/t}
  expect: no transform (diverges)
  correct:
  - error: []
  severe:
  - {ok: true}

- id: v_adv/ilap_1
  input: {op: inverse_laplace, expr: 1/(s*(s + 1))}
  expect: 1 - e^-t
  correct:
  - {ok: true}
  - expr: {equals: 1 - exp(-t)}

- id: v_adv/ilap_cos
  input: {op: inverse_laplace, expr: s/(s**2 + 4)}
  expect: cos 2t
  correct:
  - {ok: true}
  - expr: {equals: cos(2*t)}

- id: v_adv/ilap_shift
  input: {op: inverse_laplace, expr: exp(-2*s)/s}
  expect: Heaviside(t-2)
  correct:
  - {ok: true}
  - expr: {equals: Heaviside(t - 2)}

- id: v_adv/ilap_damped
  input: {op: inverse_laplace, expr: 1/(s**2 + 2*s + 5)}
  expect: e^-t sin(2t)/2
  correct:
  - {ok: true}
  - expr: {equals: exp(-t)*sin(2*t)/2}

- id: v_adv/ilap_delta
  input: {op: inverse_laplace, expr: '1'}
  expect: DiracDelta(t)
  correct:
  - {ok: true}
  - expr: {equals: DiracDelta(t)}

- id: v_adv/ilap_improper
  input: {op: inverse_laplace, expr: s/(s - 1)}
  expect: delta + e^t
  correct:
  - {ok: true}
  - expr: {equals: DiracDelta(t) + exp(t)}

- id: v_adv/m_2x2
  input:
    op: matrix
    matrix:
    - ['1', '2']
    - ['3', '4']
  expect: det -2, inv [[-2,1],[3/2,-1/2]], eig (5±sqrt33)/2
  correct:
  - {ok: true}
  - expr: {equals: '-2', path: det.result}
  - eq: {rank: 2}
  - eq:
      inverse.result:
      - ['-2', '1']
      - [3/2, -1/2]
  - set:
      path: eigen.values
      items: [(5 - sqrt(33))/2, (5 + sqrt(33))/2]
  quick: true

- id: v_adv/m_singular
  input:
    op: matrix
    matrix:
    - ['1', '2']
    - ['2', '4']
  expect: det 0, rank 1, no inverse
  correct:
  - {ok: true}
  - expr: {equals: '0', path: det.result}
  - eq: {rank: 1}
  - missing: [inverse]

- id: v_adv/m_jordan
  input:
    op: matrix
    matrix:
    - ['1', '1']
    - ['0', '1']
  expect: eig 1 mult 2, 1 vector, not diagonalizable
  correct:
  - {ok: true}
  - set:
      path: eigen.values
      items: ['1']
  - eq: {eigen.values.0.multiplicity: 2, eigen.diagonalizable: false}
  - len: {eigen.values.0.vectors: 1}

- id: v_adv/m_rot
  input:
    op: matrix
    matrix:
    - ['0', '-1']
    - ['1', '0']
  expect: eig ±i
  correct:
  - {ok: true}
  - set:
      path: eigen.values
      items: [I, -I]

- id: v_adv/m_3x3
  input:
    op: matrix
    matrix:
    - ['2', '0', '0']
    - ['0', '3', '4']
    - ['0', '4', '9']
  expect: det 22, eig 1,2,11
  correct:
  - {ok: true}
  - expr: {equals: '22', path: det.result}
  - set:
      path: eigen.values
      items: ['1', '2', '11']

- id: v_adv/m_prod
  input:
    op: matrix
    matrix:
    - ['1', '2']
    - ['3', '4']
    matrix_b:
    - ['0', '1']
    - ['1', '0']
  expect: '[[2,1],[4,3]]'
  correct:
  - {ok: true}
  - eq:
      product.result:
      - ['2', '1']
      - ['4', '3']

- id: v_adv/m_float
  input:
    op: matrix
    matrix:
    - [0.1, 0.2]
    - [0.3, 0.4]
  expect: det -0.02
  correct:
  - {ok: true}
  - num: {value: -0.02, rel: 1.0e-09, path: det.result}

- id: v_adv/m_rank_def3
  input:
    op: matrix
    matrix:
    - ['1', '2', '3']
    - ['4', '5', '6']
    - ['7', '8', '9']
  expect: det 0 rank 2
  correct:
  - {ok: true}
  - expr: {equals: '0', path: det.result}
  - eq: {rank: 2}

- id: v_adv/m_sym
  input:
    op: matrix
    matrix:
    - [a, '1']
    - ['1', a]
  expect: det a^2-1, eig a±1
  correct:
  - {ok: true}
  - expr: {equals: a**2 - 1, path: det.result}
  - set:
      path: eigen.values
      items: [a - 1, a + 1]

- id: v_adv/p_norm196
  input: {op: probability, dist: 'Normal(0, 1)', expr: X > 1.96}
  expect: '0.0249979'
  correct:
  - {ok: true}
  - num: {value: 0.0249979, rel: 0.0001}

