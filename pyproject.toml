[project]
name = "openstem-mcp"
dynamic = ["version"]  # src/openstem/__init__.py의 __version__ 하나만 고친다
description = "이공계 학습용 MCP 서버: 학술 그림 렌더링, 풀이 검산, 문서 내보내기"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "openstem-mcp contributors" }]
keywords = ["mcp", "stem", "education", "tikz", "latex", "sympy", "rdkit", "physics", "chemistry", "math"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "matplotlib>=3.10",
    "httpx2>=2.10",  # lms(학교 LMS 연결). mcp 2.x도 쓰는 httpx 갈래
    "mcp>=2.3.0,<3",
    "numpy>=2.2",
    "olefile>=0.47",
    "pint>=0.25.3",  # check_units(차원 분석·단위 변환)
    # 2.0은 인텔 맥·일부 플랫폼용 wheel이 없고 onnxruntime(수십 MB)까지 끌고 온다. 쓰는 기능은 1.24부터 있다.
    "pymupdf>=1.24,<2",
    "pypandoc-binary>=1.17",
    "rdkit>=2025.3",
    "sympy>=1.14",
]

[project.urls]
Homepage = "https://github.com/kimi94279-glitch/openstem-mcp"
Issues = "https://github.com/kimi94279-glitch/openstem-mcp/issues"

[project.scripts]
openstem-mcp = "openstem.server:main"

[project.optional-dependencies]
latex = [
    "antlr4-python3-runtime==4.11.*",
]

[dependency-groups]
dev = [
    "antlr4-python3-runtime==4.11.*",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openstem/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openstem"]

# 저장소 루트의 templates/를 패키지 안(openstem/templates)으로 넣어 uvx 설치에서도 보이게 한다.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "openstem/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
