# render_tikz 입력 → 기대 결과
# expect.ok: 성공 여부 / errors_contain: errors를 합친 문자열에 들어 있어야 할 조각 / no_warnings: 경고 없음

- id: arrow-with-library
  input:
    code: |
      \begin{tikzpicture}
      \draw[-{Stealth[length=3mm]}] (0,0) -- (2,1) node[right] {$\vec{F}$};
      \end{tikzpicture}
    tikz_libraries: [arrows.meta]
  expect: {ok: true, no_warnings: true}

- id: bare-commands-get-wrapped
  input:
    code: \draw (0,0) circle (1);
  expect: {ok: true}

- id: hangul-label
  input:
    code: |
      \begin{tikzpicture}
      \draw[->] (0,0) -- (2,0) node[right] {마찰력 $f$};
      \end{tikzpicture}
  expect: {ok: true, no_warnings: true}

- id: pgfplots-autodetect
  input:
    code: |
      \begin{tikzpicture}
      \begin{axis}[xlabel=$x$, ylabel=$y$, width=6cm]
      \addplot[domain=0:6.28, samples=40] {sin(deg(x))};
      \end{axis}
      \end{tikzpicture}
  expect: {ok: true}

- id: full-standalone-document
  input:
    code: |
      \documentclass[border=2pt]{standalone}
      \usepackage{tikz}
      \begin{document}
      \tikz \draw (0,0) rectangle (1,1);
      \end{document}
  expect: {ok: true}

- id: typo-command
  input:
    code: |
      \begin{tikzpicture}
      \draw (0,0) -- (1,0);
      \drwa (0,0) -- (0,1);
      \end{tikzpicture}
  expect:
    ok: false
    errors_contain: ["Undefined control sequence", "l.3 \\drwa"]

- id: missing-semicolon-full-document
  input:
    code: |
      \documentclass{standalone}
      \usepackage{tikz}
      \begin{document}
      \begin{tikzpicture}
      \draw (0,0) -- (1,0)
      \end{tikzpicture}
      \end{document}
  expect:
    ok: false
    errors_contain: ["semicolon", "l.6"]

- id: unknown-library
  input:
    code: \draw (0,0) -- (1,0);
    tikz_libraries: [notalibrary]
  expect:
    ok: false
    errors_contain: ["notalibrary", "(preamble)"]

- id: unclosed-environment
  input:
    code: |
      \begin{tikzpicture}
      \draw (0,0) -- (1,0);
  expect:
    ok: false
    errors_contain: ["Extra }", "after the end of code"]

- id: disallowed-package
  input:
    code: \draw (0,0) -- (1,0);
    packages: [minted]
  expect:
    ok: false
    errors_contain: ["minted", "not allowed"]

- id: file-read-blocked
  input:
    code: |
      \begin{tikzpicture}
      \node {\input{secret.txt}};
      \end{tikzpicture}
  expect:
    ok: false
    errors_contain: ["l.2 \\input"]
