  expect: {ok: false, errors_contain: ["invalid arguments"]}

- id: error-probability-unknown-distribution
  input: {op: probability, dist: "Gamma(1, 2)", expr: "X > 1"}
  expect: {ok: false, errors_contain: ["Unknown distribution 'Gamma'"]}

- id: error-probability-absolute-value-event
  input: {op: probability, dist: "Normal(0, 1)", expr: "abs(X) < 1.96"}
