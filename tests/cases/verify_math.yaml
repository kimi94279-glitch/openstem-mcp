# ── solve 부등식 ──────────────────────────────────────
- id: inequality-quadratic
  input: {op: solve, expr: "x**2 - 4 > 0"}
  expect: {ok: true, result: "(-oo, -2) ∪ (2, oo)"}

- id: inequality-rational-keeps-closed-end
  input: {op: solve, expr: "(x - 1)/(x + 2) >= 0"}
  expect: {ok: true, result: "(-oo, -2) ∪ [1, oo)"}

- id: inequality-chain-and-system-intersect
  input: {op: solve, expr: "0 < x <= 3; x**2 > 2"}
  expect: {ok: true, result: "(sqrt(2), 3]"}

- id: inequality-cubic-with-irrational-roots
  input: {op: solve, expr: "x**3 - 3*x + 1 > 0"}
  expect: {ok: true, result: "(-1.879385, 0.3472964) ∪ (1.532089, oo)", contains: ["approximations"]}

- id: inequality-no-solution
  input: {op: solve, expr: "x**2 + 1 < 0"}
  expect: {ok: true, result: "∅", contains: ["No solution"]}

- id: inequality-assume-positive
  input: {op: solve, expr: "x**2 - 4 > 0", assume: positive}
  expect: {ok: true, result: "(2, oo)"}

- id: inequality-absolute-value
  input: {op: solve, expr: "abs(x - 1) < 3"}
  expect: {ok: true, result: "(-2, 4)"}

- id: inequality-transcendental-numeric
  input: {op: solve, expr: "sin(x) > x/2"}
  expect: {ok: true, result: "(-1000, -1.895494) ∪ (0, 1.895494)", contains: ["searched numerically in [-1000, 1000]", "still holds at x = -1000"]}

- id: error-inequality-with-parameter
  input: {op: solve, expr: "x**2 < a"}
  expect: {ok: false, errors_contain: ["one variable only"]}

- id: error-inequality-mixed-with-equation
  input: {op: solve, expr: "x > 0; x**2 = 4"}
  expect: {ok: false, errors_contain: ["equations and inequalities"]}

