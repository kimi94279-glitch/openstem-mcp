  expect: {ok: true, approx: 0.0227501, fields: {variance: "36"}}

- id: probability-binomial-at-least
  input: {op: probability, dist: "Binomial(10, 0.3)", expr: "X >= 3"}
  expect: {ok: true, result: "771521517/1250000000", fields: {mean: "3", variance: "21/10 ≈ 2.1"}}

- id: probability-binomial-exact-value
  input: {op: probability, dist: "Binomial(10, 0.3)", expr: "X = 3"}
  expect: {ok: true, approx: 0.2668279}

- id: probability-poisson
  input: {op: probability, dist: "Poisson(2)", expr: "X <= 2"}
  expect: {ok: true, result: "5*exp(-2)"}

- id: probability-exponential-rate
  input: {op: probability, dist: "Exponential(0.5)", expr: "X > 3"}
  expect: {ok: true, result: "exp(-3/2)", fields: {mean: "2"}}

- id: probability-uniform-expectation
  input: {op: probability, dist: "Uniform(0, 4)", expr: "X**2"}
  expect: {ok: true, result: "16/3", fields: {expectation: "E[X**2]"}}

- id: probability-continuous-point-is-zero
