name: 버그 보고
description: 툴이 잘못 동작하거나 설치·실행이 안 될 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **비밀을 넣지 마세요.** LMS 토큰, 캘린더 주소(.ics 주소 안에 개인 키가 있습니다), 비밀 키가 든 HTTP 모드 주소,
        로그 속 `Authorization`·`token=`·`key=` 값은 지우거나 `***`로 바꿔 주세요. 공개 이슈는 누구나 봅니다.
        보안 문제는 이슈 대신 [SECURITY.md](https://github.com/kimi94279-glitch/openstem-mcp/blob/main/SECURITY.md)의 방법으로 알려 주세요.
  - type: input
    id: version
    attributes:
      label: openstem-mcp 버전
      description: "`uvx openstem-mcp --version` 출력이나 .mcpb 파일 이름"
      placeholder: openstem-mcp 0.3.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS 15 (Apple Silicon) / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: 호스트(AI 앱)
      options:
        - Claude Desktop (.mcpb)
        - Claude Code
        - Claude Code 플러그인
        - ChatGPT (HTTP 모드)
        - 기타 MCP 클라이언트
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: AI에 한 요청, 부른 툴과 입력(가능하면), 순서
      placeholder: |
        1. "RC 회로 그려 줘"라고 요청
        2. render_tikz가 ... 입력으로 불림
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 에러 글, 호스트 로그(비밀을 지운 것), 결과 파일 스크린샷
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: 확인
      options:
        - label: 토큰·캘린더 주소·비밀 키·로그 속 비밀을 지웠습니다.
          required: true
