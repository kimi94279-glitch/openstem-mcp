# GitHub에서 릴리스를 만들면 PyPI에 올리고, Claude Desktop 원클릭 설치 파일(.mcpb)을 릴리스에 붙인다.
# PyPI는 신뢰할 수 있는 게시(토큰 없이 OIDC). 처음 한 번 pypi.org → Account settings → Publishing에서
# pending publisher를 추가한다:
#   PyPI Project Name: openstem-mcp / Owner: (GitHub 계정) / Repository: openstem-mcp
#   Workflow name: publish.yml / Environment name: pypi
# 배포 전에 ci.yml(3개 OS 시험, OPENSTEM_REQUIRE_TEX=1)을 다시 돌려 통과해야 publish·bundle이 돈다.
# 서드파티 Action은 커밋 SHA로 고정한다(주석은 태그). checkout은 자격 증명을 남기지 않는다(persist-credentials: false).
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv build
      - run: uv publish --trusted-publishing always

  bundle:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 릴리스에 파일 올리기
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      # 공식 CLI(npx @anthropic-ai/mcpb@<고정 버전>, scripts/build_mcpb.py의 MCPB_CLI)로 검사·묶기. 빌드 스크립트는 표준 라이브러리만 쓴다.
      - run: uv run --no-project python scripts/build_mcpb.py
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/*.mcpb
        env:
          GH_TOKEN: ${{ github.token }}

  # 공식 MCP 레지스트리(registry.modelcontextprotocol.io)에 올린다. GitHub OIDC로 로그인하므로 토큰이 필요 없다.
  # PyPI 소유 확인은 README의 `mcp-name:` 줄, .mcpb는 릴리스에 붙은 파일의 sha256으로 한다.
  registry:
    needs: [publish, bundle]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      MCP_PUBLISHER_VERSION: v1.8.7
      # 버전을 올리면 같이 고친다: 릴리스의 registry_<버전>_checksums.txt에서 mcp-publisher_linux_amd64.tar.gz 줄
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          gh release download "$MCP_PUBLISHER_VERSION" -R modelcontextprotocol/registry -p "mcp-publisher_linux_amd64.tar.gz"
          # 고정한 해시와 맞아야 압축을 연다. 릴리스의 checksums 파일과도 한 번 더 맞춰 본다.
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          gh release download "$MCP_PUBLISHER_VERSION" -R modelcontextprotocol/registry -p "registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          grep -E '  mcp-publisher_linux_amd64\.tar\.gz$' "registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Fill version and bundle hash in server.json
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" -p "*.mcpb" -D bundle
          FILE=$(ls bundle/*.mcpb)
          SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$FILE")"
          jq --arg v "$VERSION" --arg sha "$SHA" --arg url "$URL" \
            '.version = $v | .packages[0].version = $v | .packages[1].identifier = $url | .packages[1].fileSha256 = $sha' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Wait until PyPI serves this version
        run: |
          for i in $(seq 1 20); do
            curl -sf "https://pypi.org/pypi/openstem-mcp/${TAG#v}/json" > /dev/null && exit 0
            sleep 15
          done
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
