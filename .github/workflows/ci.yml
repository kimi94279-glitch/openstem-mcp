# push·pull_request마다 잠금 파일(uv.lock) 그대로 시험을 돌린다. 릴리스(publish.yml)도 이 워크플로를 불러 통과해야 배포한다.
# tectonic이 없으면 렌더링 시험이 건너뛰어지는 대신 실패하도록 OPENSTEM_REQUIRE_TEX=1을 켠다(tests/conftest.py).
# 서드파티 Action은 커밋 SHA로 고정한다(주석은 태그). 올릴 때는 dependabot PR을 쓰거나
# `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`로 확인한다.
name: CI

on:
  push:
  pull_request:
  workflow_call:  # publish.yml이 릴리스 전에 부른다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]  # requires-python 하한과 최신 하나
        include:
          # openstem 캐시 폴더(자동 설치한 tectonic, 준비 표시). TeX 번들 파일은 아래 TECTONIC_CACHE_DIR로 모은다.
          - os: ubuntu-latest
            openstem-cache: ~/.cache/openstem
          - os: macos-latest
            openstem-cache: ~/Library/Caches/openstem
          - os: windows-latest
            openstem-cache: ~\AppData\Local\openstem
    env:
      OPENSTEM_REQUIRE_TEX: "1"
      UV_PYTHON: ${{ matrix.python }}  # 저장소의 .python-version(.mcpb용)보다 우선한다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # tectonic 기본 캐시 위치는 OS마다 이름 규칙이 달라(Linux는 ~/.cache/tectonic 소문자) 공식 환경변수로 한곳에 고정한다.
      - name: Pin tectonic cache location
        shell: bash
        run: echo "TECTONIC_CACHE_DIR=${{ runner.temp }}/tectonic-cache" >> "$GITHUB_ENV"
      # 운영체제 격리(OPENSTEM_ISOLATION, docs/decisions/0014): Linux는 bubblewrap으로 tectonic·작업자를 샌드박스에 넣는다.
      # tests/test_isolation.py는 GitHub Actions의 ubuntu·macos에서 격리를 못 쓰면 건너뛰지 않고 실패한다.
      - name: Install bubblewrap (Linux OS isolation)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          bwrap --version
          # Ubuntu 24.04는 AppArmor로 비특권 사용자 네임스페이스를 막는다(bwrap: "loopback: Failed RTM_NEWADDR").
          # Ubuntu가 권하는 방법대로 bwrap에만 userns를 허용하는 프로필을 넣는다(sysctl로 전체를 풀지 않는다).
          if [ -d /etc/apparmor.d ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' \
              | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr --symlink usr/lib64 /lib64 --symlink usr/lib /lib --proc /proc --dev /dev /usr/bin/true \
            && echo "bwrap works" || echo "bwrap cannot create a sandbox here"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # restore와 save를 나눈다: 시험이 실패해도 준비가 끝난 TeX 캐시는 저장해 다음 실행이 다시 받지 않게 한다.
      - name: Restore TeX cache
        id: tex-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ matrix.openstem-cache }}
            ${{ runner.temp }}/tectonic-cache
          key: tex-v2-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('src/openstem/render/tectonic_setup.py', 'src/openstem/render/latex.py', 'src/openstem/tools/tikz.py', 'src/openstem/tools/export.py', 'templates/**') }}
          restore-keys: |
            tex-v2-${{ runner.os }}-py${{ matrix.python }}-
            tex-v2-${{ runner.os }}-
      - name: Install (uv.lock as is)
        run: uv sync --locked --all-extras
      - name: Prepare tectonic and TeX bundle
        id: warmup
        run: uv run --locked --all-extras openstem-mcp --warmup
      - name: Diagnose TeX failure
        if: failure() && steps.warmup.outcome == 'failure'
        run: uv run --locked --all-extras python .github/scripts/tex_diagnose.py
      - name: Save TeX cache
        if: steps.warmup.outcome == 'success' && steps.tex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ matrix.openstem-cache }}
            ${{ runner.temp }}/tectonic-cache
          key: ${{ steps.tex-cache.outputs.cache-primary-key }}
      - name: Test
        run: uv run --locked --all-extras pytest -ra
