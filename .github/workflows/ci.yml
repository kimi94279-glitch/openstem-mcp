# push·pull_request마다 잠금 파일(uv.lock) 그대로 시험을 돌린다. 릴리스(publish.yml)도 이 워크플로를 불러 통과해야 배포한다.
# tectonic이 없으면 렌더링 시험이 건너뛰어지는 대신 실패하도록 OPENSTEM_REQUIRE_TEX=1을 켠다(tests/conftest.py).
# 서드파티 Action은 커밋 SHA로 고정한다(주석은 태그). 올릴 때는 dependabot PR을 쓰거나
# `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`로 확인한다.
name: CI

on:
  push:
  pull_request:
  workflow_call:  # publish.yml이 릴리스 전에 부른다
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]  # requires-python 하한과 최신 하나
        include:
          # 캐시 폴더: openstem(자동 설치한 tectonic, 준비 표시)과 tectonic 자체 캐시(TeX 번들 파일)
          - os: ubuntu-latest
            tex-cache: |
              ~/.cache/openstem
              ~/.cache/Tectonic
          - os: macos-latest
            tex-cache: |
              ~/Library/Caches/openstem
              ~/Library/Caches/Tectonic
          - os: windows-latest
            tex-cache: |
              ~\AppData\Local\openstem
              ~\AppData\Local\TectonicProject
    env:
      OPENSTEM_REQUIRE_TEX: "1"
      UV_PYTHON: ${{ matrix.python }}  # 저장소의 .python-version(.mcpb용)보다 우선한다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Restore TeX cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ matrix.tex-cache }}
          key: tex-${{ runner.os }}-${{ hashFiles('src/openstem/render/tectonic_setup.py', 'src/openstem/render/latex.py', 'src/openstem/tools/tikz.py', 'src/openstem/tools/export.py') }}
          restore-keys: |
            tex-${{ runner.os }}-
      - name: Install (uv.lock as is)
        run: uv sync --locked --all-extras
      - name: Prepare tectonic and TeX bundle
        run: uv run --locked --all-extras openstem-mcp --warmup
      - name: Test
        run: uv run --locked --all-extras pytest -ra
