# 워크플로의 Action(커밋 SHA 고정)과 uv.lock 의존성 갱신 PR을 매주 연다. PR은 CI(3개 OS 시험)를 통과해야 합친다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]
